[build-system]
requires = ["hatchling >= 1.26", "wheel >= 0.45.0"]
build-backend = "hatchling.build"

[project]
name = "sensirion_shdlc_sensorbridge"
description = "Driver for Communicating With Sensirion SEK-SensorBridge"
version =  "1.0.0"

readme = "README.md"
requires-python = ">=3.8,<4.0"

authors = [
    { name = "Sensirion", email = "info@sensirion.com" },
]

license = "BSD-3-Clause"
license-files = ["LICENSE"]

keywords = ["shdlc", "sensirion", "sensor bridge",  "sensorbridge driver"]

classifiers = [
    'Intended Audience :: Developers',
    'License :: OSI Approved :: BSD License',
    'Programming Language :: Python :: 3.8',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Topic :: System :: Hardware :: Hardware Drivers'
]

dependencies = [
    "sensirion-shdlc-driver >=1.0.2"
]

[project.optional-dependencies]

docs=[
    "sphinx-rtd-theme==3.0.2",
    "sphinx==8.2.3"
]

test= [
    "flake8>=7.1.0",
    "mock~=5.2.0",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "setuptools>=73.2.0"
]

[project.urls]
Changelog = "https://github.com/Sensirion/python-shdlc-sensorbridge/blob/master/CHANGELOG.rst"
Repository = "https://github.com/Sensirion/python-shdlc-sensorbridge"
Documentation = "https://sensirion.github.io/python-shdlc-sensorbridge"

